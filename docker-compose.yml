# yarr - YouTube -> MP3 -> Plex music library.
# Works for a local smoke test and for a Compose/Dokploy deployment.

services:
  yarr:
    build:
      context: .
    image: yarr:latest
    container_name: yarr
    restart: unless-stopped

    ports:
      # Host port -> container port. The container always listens on 7734.
      - "${HOST_PORT:-7734}:7734"

    environment:
      # Internal listen port. Keep this at 7734; change HOST_PORT to move the
      # host-side port only.
      PORT: "7734"
      # Where MP3s are written inside the container. Mount your Plex music
      # folder here with MUSIC_HOST_PATH.
      MUSIC_LIBRARY_PATH: /music
      # Scratch space for downloads before they are saved.
      STAGING_PATH: /data/staging
      # MP3 bitrate (kbps) passed to FFmpeg.
      AUDIO_QUALITY: ${AUDIO_QUALITY:-192}
      # Cookies file path inside the container (optional). Defaults to the
      # mounted /cookies.txt placeholder.
      YTDLP_COOKIEFILE: ${YTDLP_COOKIEFILE:-/cookies.txt}
      # Optional: comma-separated yt-dlp YouTube player clients, e.g.
      # "android,tv,web_embedded". Leave empty to use yt-dlp defaults.
      YTDLP_PLAYER_CLIENTS: ${YTDLP_PLAYER_CLIENTS:-}
      # Run the app as this uid/gid so new files in /music get the right
      # ownership on the host.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}

    volumes:
      # Your existing Plex music library. Artist/Album folders live under it.
      - ${MUSIC_HOST_PATH:-./music}:/music
      # Scratch data. Downloaded files are cleaned up after a successful save.
      - yarr_data:/data
      # Cookies from a logged-in browser (optional). By default this mounts the
      # empty placeholder cookies.txt shipped in this repo, which has no cookies
      # and is harmless. To use real cookies, set COOKIES_HOST_PATH in .env to
      # your exported cookies.txt. The app continues without cookies if this is
      # missing or invalid.
      - ${COOKIES_HOST_PATH:-./cookies.txt}:/cookies.txt:ro

volumes:
  yarr_data:
